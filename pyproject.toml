[project]
name = "xrd-analysis"
version = "1.0.0"
description = "Powder XRD reference lines and impurity screening"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "streamlit>=1.64,<1.65",
    "plotly>=5.22,<7.2",
    "openpyxl>=3.1.2,<4",
    "numpy>=1.26.4,<2.3 ; python_version == '3.10'",
    "scipy>=1.11.4,<1.16 ; python_version == '3.10'",
    "pandas>=2.2.2,<2.4 ; python_version == '3.10'",
    "numpy>=1.26.4,<2.5 ; python_version == '3.11'",
    "scipy>=1.11.4,<1.18 ; python_version == '3.11'",
    "pandas>=2.2.2,<3.1 ; python_version == '3.11'",
    "numpy>=1.26.4,<2.6 ; python_version >= '3.12'",
    "scipy>=1.11.4,<1.19 ; python_version >= '3.12'",
    "pandas>=2.2.2,<3.1 ; python_version >= '3.12'",
    "pyarrow>=22,<26,!=25.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "crystallography", "materials", "plotting", "xrd_processing"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["scattering_factors.json"]
